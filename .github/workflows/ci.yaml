name: Publish Temporary Image
on:
  pull_request:

permissions:
  packages: write
  pull-requests: write
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@main

      # nosemgrep
      - uses: tapclap/build-images-action@main
        id: build-images
        with:
          registry: ghcr.io
          registry-user: ${{ github.repository_owner }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          tag: "tmp-{{ ref }}-{{ commit }}"
          operation: build-and-push
          build-opts: |
            - name: main
              repo-image-name: true
              file: ./Dockerfile

      - name: Comment PR with install command
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          IMAGE: ${{ fromJson(steps.build-images.outputs.built-images).main }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const marker = `<!-- COMMENT_BUILT_IMAGE -->`;
            const body = [
              marker,
              `### Built image:`,
              "```",
              `${process.env.IMAGE}`,
              "```"
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
